<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Document Editor</title>
<style>
  html, body, #holder { width: 100%; height: 100%; margin: 0; padding: 0; background: #222; overflow: hidden; }
  #status { color: #ccc; font: 14px sans-serif; text-align: center; padding-top: 40px; }
</style>
</head>
<body>
<div id="status">Loading document…</div>
<div id="holder" style="display:none"></div>
<script>
  // Config comes in via the query string (this page is loaded with
  // file:///.../office_editor.html?documentType=...&... -- see
  // DocumentViewerWindow.xaml.cs's ShowOffice()) rather than postMessage,
  // since it's just navigated to fresh each time, never reused.
  const params = new URLSearchParams(location.search);
  const cfg = {
    documentType: params.get("documentType"),
    fileType: params.get("fileType"),
    editable: params.get("editable") === "true",
    key: params.get("key"),
    title: params.get("title") || "Document",
    documentUrl: params.get("documentUrl"),
    onlyofficeUrl: params.get("onlyofficeUrl"),
    callbackUrl: params.get("callbackUrl") || undefined,
  };

  // Per a real incident (2026-10-07): OnlyOffice's own editor can fail to
  // open a document (e.g. it couldn't fetch documentUrl) and shows that
  // failure ONLY inside its own iframe, via showError() below -- nothing
  // about it ever reached the WPF shell or the backend's log, so a real
  // failure looked identical to "saved" everywhere except this page's own
  // DOM, which nobody was looking at after the window closed. postToHost
  // mirrors it out to DocumentViewerWindow.xaml.cs (OnOfficeWebMessage),
  // which now also forces the close-time outcome to "error" instead of the
  // previous blind "saved" -- see that file's own doc comment.
  function postToHost(msg) {
    if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(msg);
  }

  function showError(msg) {
    const status = document.getElementById("status");
    status.style.display = "block";
    status.textContent = msg;
    document.getElementById("holder").style.display = "none";
    postToHost({ type: "office_error", message: msg });
  }

  if (!cfg.documentUrl || !cfg.onlyofficeUrl) {
    showError("Missing document configuration.");
  } else {
    const script = document.createElement("script");
    script.src = `${cfg.onlyofficeUrl}/web-apps/apps/api/documents/api.js`;
    script.onload = () => {
      document.getElementById("status").style.display = "none";
      document.getElementById("holder").style.display = "block";
      try {
        new DocsAPI.DocEditor("holder", {
          document: {
            fileType: cfg.fileType,
            key: cfg.key,
            title: cfg.title,
            url: cfg.documentUrl,
            permissions: { edit: cfg.editable, download: true },
          },
          documentType: cfg.documentType,
          editorConfig: {
            mode: cfg.editable ? "edit" : "view",
            callbackUrl: cfg.callbackUrl,
            lang: "en",
          },
          events: {
            onError: (event) => {
              const detail = event && event.data && (event.data.errorDescription || event.data.errorCode);
              showError(detail ? String(detail) : "The document editor reported an error.");
            },
          },
          width: "100%",
          height: "100%",
        });
      } catch (e) {
        showError("Could not start the document editor: " + e.message);
      }
    };
    script.onerror = () => showError("Could not reach the document editor server.");
    document.head.appendChild(script);
  }
</script>
</body>
</html>
