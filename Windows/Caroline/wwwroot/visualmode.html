<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  img, video { width: 100%; height: 100%; object-fit: contain; display: block; }
  #vid { display: none; position: relative; }
  /* The rest pose shown between the remarks of a dialogue: under the video, so that it
     stays in view until the next clip is really playing. */
  #staticImg { position: absolute; left: 0; top: 0; display: none; }
  /* The previous clip's last frame, under the video -- see holdLastFrame. */
  #hold { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; display: none; }
</style>
</head>
<body>
  <img id="staticImg" />
  <canvas id="hold"></canvas>
  <video id="vid"></video>
  <script>
    const staticImg = document.getElementById("staticImg");
    const vid = document.getElementById("vid");
    const hold = document.getElementById("hold");

    // One window now plays several clips in a row (the pieces of one reply -- see
    // VisualModeManager.StartPostRoll). Changing the video's src blanks the element
    // until the new clip has a frame, and the head would blink out between two pieces:
    // the frame it stopped on stays up underneath until the new clip is really playing.
    function holdLastFrame() {
      if (vid.style.display !== "block" || vid.readyState < 2 || !vid.videoWidth) return;
      hold.width = vid.videoWidth;
      hold.height = vid.videoHeight;
      hold.getContext("2d").drawImage(vid, 0, 0);
      hold.style.display = "block";
    }
    function releaseHeldFrame() {
      hold.style.display = "none";
    }
    // The new clip has a frame on screen: whatever stood in for it goes.
    function onPlaying() {
      vid.style.display = "block";
      staticImg.style.display = "none";
      releaseHeldFrame();
    }

    // Called by VisualModeWindow.xaml.cs (ExecuteScriptAsync) to show the "silence" frame
    // the moment TTS generation starts, before any audio/render exists yet.
    window.showStatic = function (dataUri) {
      releaseHeldFrame();
      vid.pause();
      vid.style.display = "none";
      staticImg.style.display = "block";
      staticImg.src = dataUri;
    };

    // Called once the rendered .webm is ready -- fileUri is a file:/// path.
    window.playVideo = function (fileUri) {
      holdLastFrame();
      vid.style.display = "block";
      vid.muted = false;
      vid.volume = 1.0;
      vid.src = fileUri;
      vid.currentTime = 0;
      // A rejected play() (autoplay policy, unsupported codec/container) used to be
      // swallowed silently here with nothing to unblock the C# side's await on
      // "ended" -- confirmed live (2026-09-03) as a real hang: render succeeded but
      // playback never started/finished, and VisualModeManager.HandleAudioAsync
      // waited on playbackEnded forever. Treat a failed play() the same as the video
      // ending -- there's nothing more this window can do about it.
      vid.play().catch((err) => {
        releaseHeldFrame();
        window.chrome.webview.postMessage({ type: "ended", error: String(err) });
      });
    };

    vid.addEventListener("playing", onPlaying);

    // Reports the real clip duration back to native the moment it's known, so
    // VisualModeWindow can hide the control bar entirely for very short clips
    // (see OnDurationKnown -- under 10s isn't worth showing pause/restart/stop for).
    vid.addEventListener("loadedmetadata", () => {
      window.chrome.webview.postMessage({ type: "duration", seconds: vid.duration });
    });

    vid.addEventListener("ended", () => {
      window.chrome.webview.postMessage({ type: "ended" });
    });

    // A mid-playback decode/network error (bad file, unsupported VP9+alpha
    // combination, etc.) fires "error", never "ended" -- without this listener
    // that also hung the C# side forever, same root cause as the play() rejection
    // above.
    vid.addEventListener("error", () => {
      const err = vid.error ? `code=${vid.error.code} message=${vid.error.message}` : "unknown";
      releaseHeldFrame();
      window.chrome.webview.postMessage({ type: "ended", error: err });
    });
  </script>
</body>
</html>
